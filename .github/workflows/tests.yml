name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies for audio and UI tests
        run: python -m pip install -r requirements-voice.txt
      - name: Prepare verified noise assets for offline tests
        run: python packaging/prepare_test_assets.py
      - run: python run_tests.py
  full-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install dependencies and check cloud voice imports
        run: python install_chatshift.py
