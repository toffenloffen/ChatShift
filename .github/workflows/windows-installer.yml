name: Windows installer review artifact
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-setup]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python packaging/test_suite.py
      - run: python packaging/fetch_sources.py
      - run: python packaging/build_windows.py
      - name: Isolated installer verification
        shell: pwsh
        run: |
          # This disposable VM has no user's installation. Test the exact delivered EXE.
          ./packaging/test_installer.ps1 -Production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatShift-Windows-review
          path: |
            dist/ChatShift-Setup.exe
            build/installer-verification/result.json
            build/installer-verification/*.log
            build/installer-verification/data/*.log
            build/installer-verification/data/*test.json
          if-no-files-found: error
